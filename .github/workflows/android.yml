
name: K'Cho RemoteCamera Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and Extract Android ZIP
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/kcho-extract

          FOUND=false

          while IFS= read -r ZIP_FILE; do
            echo "Checking ZIP: $ZIP_FILE"

            EXTRACT_DIR="/tmp/kcho-extract/$(basename "$ZIP_FILE" .zip)"
            mkdir -p "$EXTRACT_DIR"

            if unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"; then
              SETTINGS_FILE=$(find "$EXTRACT_DIR" \
                -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
                -not -path "*/.gradle/*" -print -quit)

              if [ -n "$SETTINGS_FILE" ]; then
                PROJECT_DIR=$(dirname "$SETTINGS_FILE")

                if [ -f "$PROJECT_DIR/app/build.gradle.kts" ] || \
                   [ -f "$PROJECT_DIR/app/build.gradle" ]; then
                  echo "Android project found: $PROJECT_DIR"
                  echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
                  FOUND=true
                  break
                fi
              fi
            fi
          done < <(find . -type f -iname "*.zip" -not -path "./.git/*")

          if [ "$FOUND" != "true" ]; then
            echo "ERROR: No Android Gradle project found inside ZIP files."
            echo "Please upload the KCho RemoteCamera project ZIP."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KCho-RemoteCamera-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

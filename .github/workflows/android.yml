
name: K'Cho RemoteCamera Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP if needed
        shell: bash
        run: |
          if [[ ! -f settings.gradle.kts && ! -f settings.gradle ]]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: No Gradle project found and no ZIP file was uploaded."
              exit 1
            fi

            mkdir -p /tmp/kcho-project
            unzip -q "$ZIP_FILE" -d /tmp/kcho-project

            SETTINGS_FILE="$(find /tmp/kcho-project -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)"

            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "ERROR: ZIP does not contain settings.gradle(.kts)."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            cp -a "$PROJECT_DIR"/. .
          fi

          test -f app/build.gradle.kts || test -f app/build.gradle
          ls -la

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KCho-RemoteCamera-2Phone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
